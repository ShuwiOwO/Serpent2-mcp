# Example configuration for serpent2-mcp (all fields optional).
# Copy to serpent2-mcp.toml in the project where you run opencode,
# or to ~/.config/serpent2-mcp/config.toml. Environment variables win.

[serpent]
# Path to the sss2 binary. Relative paths resolve against the workspace.
# Default: ./sss2 in the workspace (searched to depth 3), then PATH.
exe = "sss2"
# Extra directories where data libraries live (auto-detected otherwise).
data_dirs = ["xsdata"]
# Mirror of the VTT data repository (optional).
# data_repo = "https://serpent.vtt.fi/repository"
# Optional explicit data files:
# acelib = "xsdata/data.xsdata"
# declib = "xsdata/sss_endfb7.dec"
# nfylib = "xsdata/sss_endfb7.nfy"

[backend]
# "local" (default) or "ssh"
type = "local"

[backend.ssh]
# host = "user@linux-host"
# workdir = "/home/user/serpent/runs"
# jobdir = "~/.serpent2-mcp/jobs"
# options = ["-o", "BatchMode=yes"]

[run]
# Default OpenMP threads for serpent_run (CLI --omp).
# omp = 4
# Prefix used when mpi_tasks is requested.
# mpi_launcher = "mpirun -np {n}"
# Kill jobs after N seconds (0 = never).
# timeout_seconds = 0

[docs]
base_url = "https://serpent.vtt.fi/docs"
auto_sync = true
max_age_days = 30

[ui]
# Language of human-readable summaries and plot labels: ru | en
lang = "ru"
